<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Points Bot V1</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag -->
  <script src="https://libtl.com/sdk.js"
          data-zone="11958872"
          data-sdk="show_11958872"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--tg-theme-bg-color, #0f1115);
      color: var(--tg-theme-text-color, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .card {
      background: var(--tg-theme-secondary-bg-color, #181b22);
      border-radius: 24px;
      padding: 30px 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,.25);
    }

    .logo {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    .description {
      opacity: .75;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .points {
      background: rgba(255,255,255,.06);
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .points-number {
      font-size: 28px;
      font-weight: bold;
      margin-top: 5px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 16px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      transition: .2s;
    }

    button:active {
      transform: scale(.97);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status {
      min-height: 25px;
      margin-top: 18px;
      line-height: 1.5;
      font-size: 14px;
    }

    .success {
      color: #43d17b;
    }

    .error {
      color: #ff5c5c;
    }

    .loading {
      opacity: .7;
    }

    .back {
      margin-top: 15px;
      background: transparent;
      border: 1px solid rgba(255,255,255,.12);
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <div class="logo">🎁</div>

    <h1>اكسب نقاط</h1>

    <div class="description">
      شاهد الإعلان واحصل على نقاطك مباشرة.
    </div>

    <div class="points">
      <div>النقاط المكتسبة</div>
      <div class="points-number" id="reward">
        +5
      </div>
    </div>

    <button id="watchBtn">
      🎬 مشاهدة الإعلان
    </button>

    <div id="status" class="status"></div>

    <button class="back" id="closeBtn">
      إغلاق
    </button>

  </div>
</div>

<script>
"use strict";

/* =========================================
   CONFIG
========================================= */

const WEBHOOK_URL =
  "https://faizafrivvv.app.n8n.cloud/webhook/points-bot/monetag-reward";

const REWARD = 5;


/* =========================================
   TELEGRAM
========================================= */

const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}


/* =========================================
   ELEMENTS
========================================= */

const watchBtn = document.getElementById("watchBtn");
const closeBtn = document.getElementById("closeBtn");
const statusEl = document.getElementById("status");


/* =========================================
   HELPERS
========================================= */

function setStatus(message, type = "") {
  statusEl.textContent = message;
  statusEl.className = "status " + type;
}


function createClaimId() {
  if (
    window.crypto &&
    typeof window.crypto.randomUUID === "function"
  ) {
    return window.crypto.randomUUID();
  }

  return (
    Date.now().toString(36) +
    "-" +
    Math.random().toString(36).substring(2, 12)
  );
}


function getTelegramUser() {
  if (!tg || !tg.initDataUnsafe) {
    return null;
  }

  return tg.initDataUnsafe.user || null;
}


/* =========================================
   CLOSE MINI APP
========================================= */

closeBtn.addEventListener("click", () => {
  if (tg) {
    tg.close();
  } else {
    window.close();
  }
});


/* =========================================
   WATCH AD
========================================= */

watchBtn.addEventListener("click", async () => {

  if (watchBtn.disabled) {
    return;
  }

  const user = getTelegramUser();

  /* Telegram check */
  if (!user || !user.id) {
    setStatus(
      "❌ يجب فتح هذه الصفحة من داخل بوت Telegram.",
      "error"
    );
    return;
  }

  /* initData check */
  if (!tg.initData) {
    setStatus(
      "❌ تعذر التحقق من Telegram.",
      "error"
    );
    return;
  }

  /* Monetag check */
  if (typeof window.show_11958872 !== "function") {
    setStatus(
      "❌ الإعلان غير جاهز حالياً. حاول مرة أخرى.",
      "error"
    );
    return;
  }

  watchBtn.disabled = true;
  watchBtn.textContent = "⏳ جاري تحميل الإعلان...";
  setStatus("يرجى مشاهدة الإعلان بالكامل...", "loading");

  const claimId = createClaimId();

  try {

    /* =====================================
       SHOW MONETAG REWARDED INTERSTITIAL
    ===================================== */

    await window.show_11958872();


    /* =====================================
       SEND REWARD TO N8N
    ===================================== */

    setStatus("⏳ جاري إضافة النقاط...", "loading");

    const response = await fetch(WEBHOOK_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        user_id: String(user.id),
        claim_id: claimId,
        initData: tg.initData
      })
    });


    /* HTTP error */
    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }


    /* Read response */
    const data = await response.json();


    /* =====================================
       SUCCESS
    ===================================== */

    if (data.ok === true) {

      const reward =
        Number(data.reward || REWARD);

      const points =
        data.points !== undefined
          ? data.points
          : "?";

      setStatus(
        `✅ تم إضافة +${reward} نقاط بنجاح!\nرصيدك الآن: ${points}`,
        "success"
      );

      watchBtn.textContent = "✅ تم احتساب الإعلان";

      /*
       * Notify Telegram
       */
      if (tg) {
        try {
          tg.HapticFeedback.notificationOccurred("success");
        } catch (e) {}
      }

      return;
    }


    /* =====================================
       DENIED
    ===================================== */

    let message = "❌ لم تتم إضافة النقاط.";

    switch (data.reason) {

      case "cooldown":
        message =
          "⏳ يجب الانتظار قليلاً قبل مشاهدة إعلان آخر.";
        break;

      case "daily_limit":
        message =
          "🚫 وصلت إلى الحد اليومي للإعلانات.";
        break;

      case "daily_earn_limit":
        message =
          "🚫 وصلت إلى الحد اليومي للنقاط.";
        break;

      case "inactive":
        message =
          "🚫 حسابك غير نشط.";
        break;

      case "duplicate":
        message =
          "⚠️ هذا الإعلان تم احتسابه مسبقاً.";
        break;

      case "invalid_user":
        message =
          "❌ Telegram User غير صالح.";
        break;

      case "missing_init_data":
        message =
          "❌ بيانات Telegram غير موجودة.";
        break;

      default:
        if (data.message) {
          message = "❌ " + data.message;
        }
    }

    setStatus(message, "error");

    watchBtn.disabled = false;
    watchBtn.textContent = "🎬 مشاهدة الإعلان";

  } catch (error) {

    console.error("Reward error:", error);

    setStatus(
      "❌ حدث خطأ أثناء إضافة النقاط. حاول مرة أخرى.",
      "error"
    );

    watchBtn.disabled = false;
    watchBtn.textContent = "🎬 مشاهدة الإعلان";

    if (tg) {
      try {
        tg.HapticFeedback.notificationOccurred("error");
      } catch (e) {}
    }
  }

});
</script>

</body>
</html>
